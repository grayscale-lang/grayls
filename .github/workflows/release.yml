name: release

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "esbuild.js"
      - "tsconfig.json"
      - "language-configuration.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Pick the next version
        id: version
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - run: npm run build

      - name: Package the VS Code extension
        run: |
          npm version "${{ steps.version.outputs.tag }}" --no-git-tag-version --allow-same-version
          npx --yes @vscode/vsce package --no-dependencies -o grayls.vsix

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.tag }}" out/server.js grayls.vsix --target "$GITHUB_SHA" --title "${{ steps.version.outputs.tag }}" --generate-notes
